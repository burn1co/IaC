<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yes or NO</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-color: #f4f6f9;
      overflow: hidden;
    }

    .card {
      text-align: center;
      background: white;
      padding: 3rem 4rem;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
      z-index: 1;
    }

    h1 {
      margin-bottom: 2rem;
      color: #333;
      font-size: 2rem;
    }

    .btn-container {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 20px;
    }

    button {
      padding: 12px 28px;
      font-size: 1.2rem;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: transform 0.2s ease, background-color 0.2s ease;
      outline: none;
    }

    #yesBtn {
      background-color: #2e7d32;
      color: white;
      z-index: 999; /* Keeps Yes button on top as it grows */
    }

    #yesBtn:hover {
      background-color: #1b5e20;
    }

    #noBtn {
      background-color: #d32f2f;
      color: white;
    }

    #noBtn:hover {
      background-color: #c62828;
    }

    .message {
      font-size: 3rem;
      font-weight: bold;
      color: #2e7d32;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="card" id="gameCard">
    <h1>Do you love me cutie pie?</h1>
    <div class="btn-container">
      <button id="yesBtn">Yes</button>
      <button id="noBtn">No</button>
    </div>
  </div>

  <script>
    const yesBtn = document.getElementById('yesBtn');
    const noBtn = document.getElementById('noBtn');
    
    let scale = 1;

    noBtn.addEventListener('click', () => {
      // Increase size on every "No" click
      scale += 0.7;
      
      // Apply scaling
      yesBtn.style.transform = `scale(${scale})`;

      // Fix position to viewport center if it gets large enough
      if (scale > 4) {
        yesBtn.style.position = 'fixed';
        yesBtn.style.top = '50%';
        yesBtn.style.left = '50%';
        yesBtn.style.transform = `translate(-50%, -50%) scale(${scale})`;
      }
    });

    yesBtn.addEventListener('click', () => {
      // Replace entire page content when "Yes" is pressed
      document.body.innerHTML = '<div class="message">that\'s good</div>';
    });
  </script>

</body>
</html>
